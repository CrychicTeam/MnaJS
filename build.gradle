buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/maven'
        }
    }
    dependencies {
        classpath "org.tomlj:tomlj:1.1.1"
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'maven-publish'
}

apply plugin: 'idea'
apply plugin: 'org.spongepowered.mixin'

jarJar.enable()

tasks.jarJar.configure {
    archiveClassifier.set("")
    finalizedBy("reobfJarJar")
}

tasks.jar.configure {
    archiveClassifier.set("slim")
}

tasks.matching { it.name == "reobfJar" }.configureEach {
    enabled = false
}

apply from: 'gradle/template-config.gradle'

def prop = { String key -> config.isSet(key) ? String.valueOf(config[key]).trim() : '' }
def hasProp = { String key -> !prop(key).isEmpty() }
def hasModrinthTarget = !project.ext.template.modrinthProject.isBlank()
def hasCurseforgeTarget = project.ext.template.curseforgeProject > 0L
def modrinthUploadTaskName = 'uploadModrinth'
def curseforgeUploadTaskName = 'uploadCurseForge'
def localDeobfJar = { String projectName, String artifactName, String version ->
    def candidate = file("../${projectName}/build/libs/${artifactName}-${prop('mc_version')}-${version}-deobf.jar")
    candidate.isFile() ? candidate : null
}

group = prop('maven_group')
version = prop('mod_version')

base {
    archivesName = "${prop('archive_name')}-${prop('mc_version')}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(prop('java') ?: '17'))
    withSourcesJar()
}

mixin {
    add sourceSets.main, "mixins.${prop('mod_id')}.refmap.json"
    config "mixins.${prop('mod_id')}.json"
}

def configureCommonRun = { runConfig, String workingDirectory ->
    runConfig.workingDirectory project.file(workingDirectory)
    runConfig.property 'forge.logging.console.level', 'debug'
    runConfig.property 'forge.enabledGameTestNamespaces', prop('mod_id')
    runConfig.property 'mixin.env.remapRefMap', 'true'
    runConfig.property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

    runConfig.setArgs(['--mixin', "mixins.${prop('mod_id')}.json"])

    runConfig.mods {
        "${prop('mod_id')}" {
            source sourceSets.main
        }
    }
}

def configureClientRun = { runConfig, String workingDirectory ->
    configureCommonRun(runConfig, workingDirectory)

    def args = ['--mixin', "mixins.${prop('mod_id')}.json"]
    if (hasProp('mc_user')) {
        def userId = prop('mc_user').split(',', 2)
        args.addAll(['--username', userId[0]])
        args.addAll(['--uuid', userId.length > 1 ? userId[1] : '00000000000000000000000000000001'])
    }
    runConfig.setArgs(args)
}

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        client {
            configureClientRun(delegate, 'run/client')
        }
        server {
            configureCommonRun(delegate, 'run/server')
        }
        gameTestServer {
            configureCommonRun(delegate, 'run/server')
        }
        data {
            configureCommonRun(delegate, 'run/data')
            args '--mod', prop('mod_id'), '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()

    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/maven'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'tterrag'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex 'software\\.bernie.*'
            includeGroup 'com.eliotlash.mclib'
        }
    }
    maven {
        name = 'TheIllusiveC4'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Mihono'
        url = 'https://maven.mihono.cn/repository/pickaid1201/'
    }
    mavenCentral()

    flatDir { dirs "libraries/${prop('mc_version')}/all" }
    flatDir { dirs "libraries/${prop('mc_version')}/classpathOnly" }
    flatDir { dirs "libraries/${prop('mc_version')}/runtimeOnly" }
    flatDir { dirs 'libraries/embedded' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${prop('mc_version')}-${prop('forge_version')}"

    implementation fg.deobf("dev.latvian.mods:kubejs-forge:${prop('kubejs_version')}")
    implementation fg.deobf("dev.latvian.mods:rhino-forge:${prop('rhino_version')}")
    implementation fg.deobf("dev.architectury:architectury-forge:${prop('architectury_version')}")

    compileOnly fg.deobf("curse.maven:probejs-585406:${prop('probejs_version')}")
    runtimeOnly fg.deobf("curse.maven:probejs-585406:${prop('probejs_version')}")
    compileOnly fg.deobf("curse.maven:probejs-legacy-956446:${prop('probejs_legacy_version')}")
    runtimeOnly fg.deobf("curse.maven:probejs-legacy-956446:${prop('probejs_legacy_version')}")

    compileOnly fg.deobf("curse.maven:mana-and-artifice-${prop('mna_id')}:${prop('mna_all_id')}")
    runtimeOnly fg.deobf("curse.maven:mana-and-artifice-${prop('mna_id')}:${prop('mna_all_id')}")

    if (project.ext.enabledFeatures.jei) {
        runtimeOnly fg.deobf("mezz.jei:jei-${prop('mc_version')}-forge:${project.ext.resolvedFeatureVersions.jei}")
    }

    if (hasProp('curios_version')) {
        compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${prop('curios_version')}")
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${prop('curios_version')}")
    }
    if (hasProp('caelus_version')) {
        compileOnly fg.deobf("top.theillusivec4.caelus:caelus-forge:${prop('caelus_version')}")
        runtimeOnly fg.deobf("top.theillusivec4.caelus:caelus-forge:${prop('caelus_version')}")
    }
    if (hasProp('geckolib_version')) {
        implementation fg.deobf(project.dependencies.create("software.bernie.geckolib:geckolib-forge-${prop('mc_version')}:${prop('geckolib_version')}") {
            transitive = false
        })
        implementation 'com.eliotlash.mclib:mclib:20'
    }
    if (hasProp('playeranimator_version')) {
        implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${prop('playeranimator_version')}")
    }
    if (hasProp('bendylib_version')) {
        runtimeOnly fg.deobf("io.github.kosmx.bendy-lib:bendy-lib-forge:${prop('bendylib_version')}")
    }
    if (hasProp('pibrary_version')) {
        implementation fg.deobf("com.mihono.pickaid:pibrary:${prop('pibrary_version')}")
    }
    if (hasProp('piserializekit_version')) {
        def piSerializeKitNotation = "com.mihono.pickaid:piserializekit:${prop('piserializekit_version')}"
        def localPiSerializeKitJar = localDeobfJar('PiSerializeKit', 'piserializekit', prop('piserializekit_version'))
        if (localPiSerializeKitJar != null) {
            implementation files(localPiSerializeKitJar)
            annotationProcessor files(localPiSerializeKitJar)
        } else {
            implementation fg.deobf(piSerializeKitNotation)
            annotationProcessor fg.deobf(piSerializeKitNotation)
        }
        // The published Gradle metadata selects the slim deobf variant; JarJar must embed the reobfuscated runtime jar.
        jarJar(group: 'com.mihono.pickaid', name: 'piserializekit', version: "[${prop('piserializekit_version')},)", ext: 'jar') {
            transitive = false
        }
    }
    if (hasProp('pikubejscompat_version')) {
        implementation fg.deobf("com.mihono.pickaid:pikubejscompat:${prop('pikubejscompat_version')}")
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
}

processResources {
    def replaceProperties = [
            mod_id                 : prop('mod_id'),
            mod_name               : prop('mod_name'),
            mod_version            : prop('mod_version'),
            version                : prop('mod_version'),
            mod_authors            : prop('mod_authors'),
            mod_license            : prop('mod_license'),
            mod_description        : prop('mod_description').replace('\\n', '\n'),
            issue_tracker          : prop('issue_tracker_url'),
            minecraft_version      : prop('mc_version'),
            minecraft_version_range: prop('mc_range'),
            forge_version          : prop('forge_version'),
            forge_version_range    : prop('forge_range'),
            loader_version_range   : prop('forge_range'),
            kubejs_version         : prop('kubejs_version')
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : prop('mod_id'),
                'Specification-Vendor'    : prop('mod_authors'),
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : archiveVersion,
                'Implementation-Vendor'   : prop('mod_authors'),
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "mixins.${prop('mod_id')}.json"
        ])
    }
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        if (hasProp('maven_url')) {
            maven {
                url = uri(prop('maven_url'))
                if (hasProp('maven_user') || hasProp('maven_passwd')) {
                    credentials {
                        username = prop('maven_user')
                        password = prop('maven_passwd')
                    }
                }
            }
        }
    }
}

def changelogHeadingVersion = { String headingText ->
    headingText.trim().replaceFirst(/^\[([^\]]+)](?:\s*-\s*.*)?$/, '$1').replaceFirst(/^v(?=\d)/, "").trim()
}

def extractVersionChangelog = { String text, String version, String sourceLabel ->
    def lines = text.replace("\r\n", "\n").replace("\r", "\n").split("\n", -1).toList()
    def headingPattern = /^(#{1,6})\s+(.+?)\s*$/
    def start = -1
    def level = 0
    def wanted = version.replaceFirst(/^v(?=\d)/, "")
    lines.eachWithIndex { String line, int index ->
        if (start >= 0) return
        def matcher = line =~ headingPattern
        if (matcher.matches() && changelogHeadingVersion(matcher[0][2]) == wanted) {
            start = index + 1
            level = matcher[0][1].length()
        }
    }
    if (start < 0) {
        throw new GradleException("Could not find changelog section for version ${version} in ${sourceLabel}")
    }
    def end = lines.size()
    for (int index = start; index < lines.size(); index++) {
        def matcher = lines[index] =~ headingPattern
        if (matcher.matches() && matcher[0][1].length() <= level) {
            end = index
            break
        }
    }
    def extracted = lines.subList(start, end).join("\n").trim()
    if (extracted.isBlank()) {
        throw new GradleException("Changelog section for version ${version} in ${sourceLabel} is empty")
    }
    extracted
}

def configuredText = { String inlineText, String relativeFile, String sectionMode, String fallbackText = "" ->
    if (inlineText != null && !inlineText.isBlank()) return inlineText
    if (relativeFile != null && !relativeFile.isBlank()) {
        def source = file(relativeFile)
        if (!source.isFile()) {
            throw new GradleException("Configured publish text file does not exist: ${relativeFile}")
        }
        def text = source.getText("UTF-8")
        return sectionMode == "full" ? text : extractVersionChangelog(text, project.ext.template.finalVersion, relativeFile)
    }
    fallbackText
}

def modrinthChangelogText = configuredText(project.ext.template.publishModrinth.changelog, project.ext.template.publishModrinth.changelogFile, project.ext.template.publishModrinth.changelogSection, "No changelog was specified.")
def curseforgeChangelogText = configuredText(project.ext.template.publishCurseforge.changelog, project.ext.template.publishCurseforge.changelogFile, project.ext.template.publishCurseforge.changelogSection, "")
def modrinthBodyText = project.ext.template.publishModrinth.syncBodyFile == null || project.ext.template.publishModrinth.syncBodyFile.isBlank() ? "" : configuredText("", project.ext.template.publishModrinth.syncBodyFile, "full", "")
def runtimeUploadJar = tasks.jarJar.archiveFile

def writeMultipartText = { OutputStream output, String boundary, String name, String value ->
    output.write("--${boundary}\r\n".getBytes("UTF-8"))
    output.write("Content-Disposition: form-data; name=\"${name}\"\r\n\r\n".getBytes("UTF-8"))
    output.write(value.getBytes("UTF-8"))
    output.write("\r\n".getBytes("UTF-8"))
}

def writeMultipartFile = { OutputStream output, String boundary, String name, File file ->
    output.write("--${boundary}\r\n".getBytes("UTF-8"))
    output.write("Content-Disposition: form-data; name=\"${name}\"; filename=\"${file.name}\"\r\n".getBytes("UTF-8"))
    output.write("Content-Type: application/java-archive\r\n\r\n".getBytes("UTF-8"))
    file.withInputStream { input -> input.transferTo(output) }
    output.write("\r\n".getBytes("UTF-8"))
}

tasks.register(modrinthUploadTaskName) {
    group = "upload"
    description = "Uploads the built runtime jar to Modrinth using project.toml settings."
    dependsOn("validateUploadConfiguration")
    dependsOn("reobfJarJar")
    onlyIf { hasModrinthTarget }
    doLast {
        def token = System.env.MODRINTH_TOKEN ?: project.ext.template.modrinthToken ?: ""
        def metadata = [
            project_id    : project.ext.template.modrinthProject,
            version_number: project.ext.template.finalVersion,
            version_title : project.ext.template.publishModrinth.versionName,
            version_type  : project.ext.template.releaseType,
            changelog     : modrinthChangelogText,
            game_versions : project.ext.template.publishModrinth.gameVersions,
            loaders       : project.ext.template.publishModrinth.loaders,
            featured      : false,
            dependencies  : [],
            file_parts    : ["file"]
        ]
        def boundary = "----PickAID${System.currentTimeMillis()}"
        def uploadUrl = new URL("https://api.modrinth.com/v2/version")
        def connection = (HttpURLConnection) uploadUrl.openConnection()
        connection.setRequestMethod("POST")
        connection.setDoOutput(true)
        connection.setRequestProperty("Authorization", token)
        connection.setRequestProperty("User-Agent", "PickAIDTemplate/1.0")
        connection.setRequestProperty("Content-Type", "multipart/form-data; boundary=${boundary}")
        connection.outputStream.withCloseable { output ->
            writeMultipartText(output, boundary, "data", groovy.json.JsonOutput.toJson(metadata))
            writeMultipartFile(output, boundary, "file", runtimeUploadJar.get().asFile)
            output.write("--${boundary}--\r\n".getBytes("UTF-8"))
        }
        def responseCode = connection.responseCode
        def responseText = responseCode >= 400 ? connection.errorStream?.getText("UTF-8") : connection.inputStream?.getText("UTF-8")
        if (responseCode < 200 || responseCode >= 300) {
            throw new GradleException("Modrinth upload failed with HTTP ${responseCode}: ${responseText ?: ''}")
        }
        logger.lifecycle("Modrinth upload accepted: ${responseText ?: "HTTP ${responseCode}"}")
    }
}

tasks.register(curseforgeUploadTaskName) {
    group = "upload"
    description = "Uploads the built runtime jar to CurseForge using project.toml settings."
    dependsOn("validateUploadConfiguration")
    dependsOn("reobfJarJar")
    onlyIf { hasCurseforgeTarget }
    doLast {
        def token = System.env.CURSEFORGE_TOKEN ?: project.ext.template.curseforgeToken ?: ""
        def metadata = [
            changelog    : curseforgeChangelogText,
            changelogType: project.ext.template.publishCurseforge.changelogType,
            displayName  : project.ext.template.publishCurseforge.displayName,
            gameVersions : project.ext.template.publishCurseforge.gameVersions,
            releaseType  : project.ext.template.releaseType
        ]
        if (project.ext.template.publishCurseforge.manualRelease) metadata.isManualRelease = true
        if (project.ext.template.publishCurseforge.parentFileId > 0L) metadata.parentFileID = project.ext.template.publishCurseforge.parentFileId
        def boundary = "----PickAID${System.currentTimeMillis()}"
        def uploadUrl = new URL("https://minecraft.curseforge.com/api/projects/${project.ext.template.curseforgeProject}/upload-file")
        def connection = (HttpURLConnection) uploadUrl.openConnection()
        connection.setRequestMethod("POST")
        connection.setDoOutput(true)
        connection.setRequestProperty("X-Api-Token", token)
        connection.setRequestProperty("Content-Type", "multipart/form-data; boundary=${boundary}")
        connection.outputStream.withCloseable { output ->
            writeMultipartText(output, boundary, "metadata", groovy.json.JsonOutput.toJson(metadata))
            writeMultipartFile(output, boundary, "file", runtimeUploadJar.get().asFile)
            output.write("--${boundary}--\r\n".getBytes("UTF-8"))
        }
        def responseCode = connection.responseCode
        def responseText = responseCode >= 400 ? connection.errorStream?.getText("UTF-8") : connection.inputStream?.getText("UTF-8")
        if (responseCode < 200 || responseCode >= 300) {
            throw new GradleException("CurseForge upload failed with HTTP ${responseCode}: ${responseText ?: ''}")
        }
        logger.lifecycle("CurseForge upload accepted: ${responseText ?: "HTTP ${responseCode}"}")
    }
}

def validateUploadConfiguration = tasks.register('validateUploadConfiguration') {
    group = "upload"
    doLast {
        modrinthChangelogText
        curseforgeChangelogText
        if (!hasModrinthTarget && !hasCurseforgeTarget) {
            throw new GradleException("At least one upload platform must be configured")
        }
        if (!(project.ext.template.releaseType in ["alpha", "beta", "release"])) {
            throw new GradleException("release_type must be one of alpha, beta, release")
        }
        def modrinthToken = System.env.MODRINTH_TOKEN ?: project.ext.template.modrinthToken ?: ""
        if (hasModrinthTarget && !modrinthToken.trim()) {
            throw new GradleException("MODRINTH_TOKEN or publish.modrinth.token or publish.modrinth_token is required when Modrinth publishing is configured")
        }
        def curseforgeToken = System.env.CURSEFORGE_TOKEN ?: project.ext.template.curseforgeToken ?: ""
        if (hasCurseforgeTarget && !curseforgeToken.trim()) {
            throw new GradleException("CURSEFORGE_TOKEN or publish.curseforge.token or publish.curseforge_token is required when CurseForge publishing is configured")
        }
    }
}

tasks.register('buildAndUploadMod') {
    group = "upload"
    dependsOn validateUploadConfiguration
    if (hasModrinthTarget) {
        dependsOn modrinthUploadTaskName
    }
    if (hasCurseforgeTarget) {
        dependsOn curseforgeUploadTaskName
    }
    doLast {
        println "Upload complete."
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
